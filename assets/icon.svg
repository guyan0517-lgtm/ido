<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142127"/>
      <stop offset="50%" stop-color="#1d2d35"/>
      <stop offset="100%" stop-color="#0f191e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="38%" r="45%">
      <stop offset="0%" stop-color="#f5d79e" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#df8f9f" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#7da58d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#142127" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe6a3"/>
      <stop offset="100%" stop-color="#f29979"/>
    </linearGradient>
    <linearGradient id="sea" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a858e"/>
      <stop offset="100%" stop-color="#1f3b43"/>
    </linearGradient>
    <linearGradient id="island" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4b483"/>
      <stop offset="100%" stop-color="#937a54"/>
    </linearGradient>
    <linearGradient id="tent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#df8f9f"/>
      <stop offset="100%" stop-color="#b06373"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#d9534f"/>
      <stop offset="60%" stop-color="#f0ad4e"/>
      <stop offset="100%" stop-color="#ffee77"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer border rim -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#7da58d" stroke-width="5" stroke-opacity="0.4"/>
  <rect x="18" y="18" width="476" height="476" rx="96" fill="none" stroke="#df8f9f" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Atmosphere Glow -->
  <circle cx="256" cy="220" r="210" fill="url(#glow)"/>

  <!-- Stars -->
  <circle cx="110" cy="110" r="3" fill="#fff" opacity="0.8"/>
  <circle cx="160" cy="80" r="2" fill="#fff" opacity="0.6"/>
  <circle cx="370" cy="95" r="3.5" fill="#ffe6a3" opacity="0.85"/>
  <circle cx="410" cy="130" r="2" fill="#fff" opacity="0.7"/>
  <circle cx="290" cy="70" r="2.5" fill="#fff" opacity="0.75"/>

  <!-- Rising Sun/Moon -->
  <circle cx="256" cy="205" r="72" fill="url(#sun)" filter="url(#shadow)"/>

  <!-- Distant Mountains -->
  <polygon points="60,330 180,240 280,330" fill="#2c424a" opacity="0.7"/>
  <polygon points="230,330 340,230 460,330" fill="#22363e" opacity="0.8"/>

  <!-- Sea -->
  <ellipse cx="256" cy="340" rx="220" ry="40" fill="url(#sea)"/>

  <!-- Island Shore -->
  <path d="M 64,400 Q 256,310 448,400 L 448,460 Q 256,480 64,460 Z" fill="url(#island)"/>

  <!-- Palm Tree Left -->
  <path d="M 120,400 Q 140,320 165,240" stroke="#684a32" stroke-width="14" stroke-linecap="round" fill="none"/>
  <!-- Palm Leaves -->
  <path d="M 165,240 Q 110,210 80,235" stroke="#4e7f60" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 165,240 Q 140,180 120,185" stroke="#5d9673" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 165,240 Q 200,180 220,195" stroke="#4e7f60" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M 165,240 Q 225,225 240,250" stroke="#5d9673" stroke-width="8" stroke-linecap="round" fill="none"/>

  <!-- Survivor Tent -->
  <polygon points="275,325 350,395 230,395" fill="url(#tent)" filter="url(#shadow)"/>
  <polygon points="275,325 305,395 245,395" fill="#301c22" opacity="0.6"/>
  <!-- Tent Pole -->
  <line x1="275" y1="318" x2="275" y2="395" stroke="#cca67c" stroke-width="3"/>

  <!-- Campfire -->
  <!-- Logs -->
  <line x1="185" y1="396" x2="215" y2="388" stroke="#5c3826" stroke-width="6" stroke-linecap="round"/>
  <line x1="185" y1="388" x2="215" y2="396" stroke="#48291a" stroke-width="6" stroke-linecap="round"/>
  <!-- Flame -->
  <path d="M 200,390 C 192,382 190,368 196,360 C 200,366 204,364 202,352 C 212,362 216,378 206,390 Z" fill="url(#fire)"/>

  <!-- Little Survivor Silhouette by the fire -->
  <circle cx="168" cy="366" r="8" fill="#e8cca4"/>
  <path d="M 168,374 L 168,392 M 168,378 L 180,384 M 168,385 L 160,395" stroke="#df8f9f" stroke-width="4" stroke-linecap="round"/>

  <!-- Title Badge on Bottom Curve -->
  <g filter="url(#shadow)">
    <rect x="96" y="420" width="320" height="48" rx="24" fill="#142127" stroke="#7da58d" stroke-width="2.5"/>
    <text x="256" y="452" text-anchor="middle" font-family="'Microsoft YaHei', 'PingFang SC', sans-serif" font-size="22" font-weight="900" fill="#f5e6cf" letter-spacing="3">我一定要活下来</text>
  </g>
</svg>
